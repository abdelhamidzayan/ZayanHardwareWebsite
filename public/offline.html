<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>أنت غير متصل | Zayan Hardware</title><style>:root{color-scheme:light;--blue:#2563eb;--ink:#111827;--muted:#6b7280;--surface:#fff;--bg:#f3f4f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}main{width:min(100%,440px);padding:32px 24px;text-align:center;background:var(--surface);border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 8px 28px #1118270d}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:var(--blue);color:#fff;font-size:28px;font-weight:800}h1{font-size:1.35rem;margin:0 0 12px}p{color:var(--muted);line-height:1.8;margin:0 0 24px}button{min-height:48px;width:100%;border:0;border-radius:14px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}</style></head><body><main><div class="mark" aria-hidden="true">ZH</div><h1>أنت غير متصل بالإنترنت</h1><p>صفحات الموقع تحتاج اتصالًا بالخادم. اتصل بالإنترنت ثم حاول فتح الصفحة مرة أخرى. لن نعرض بيانات قديمة أو خاصة من جلسة سابقة.</p><button type="button" onclick="location.reload()">إعادة المحاولة</button></main></body></html>
