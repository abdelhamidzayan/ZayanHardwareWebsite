name: One-time legacy branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/cleanup-legacy-branches.trigger"

permissions:
  contents: write

jobs:
  delete-reviewed-legacy-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the reviewed superseded branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "audit/content-retention-consistency"
            "audit/full-system-20261030"
            "audit/full-system-graphify"
            "audit/graphify-system-20261030"
            "audit/system-rebuild-20261031"
            "docs/actions-usage-policy-20261031"
            "docs/ai-handoff-and-feature-log-20261031"
            "docs/ai-project-memory"
            "feat/admin-featured-home-posts"
            "feat/full-help-support-page"
            "feat/login-header-phone-email"
            "feat/registration-permissions-final-spec"
            "feat/three-stage-registration"
            "feature/issue-discussion"
            "feature/profiles-help-media"
            "feature/profiles-help-messaging-media"
            "fix/audit-priority-issues"
            "fix/draft-media-recovery-20261031"
            "fix/issue-1-attachments-rendering"
            "fix/issue-500-logging"
            "fix/issue-routing-htaccess"
            "fix/login-form-layout"
            "fix/skill-test-answer-validation-20261031"
            "fix/skill-test-input-hardening-20261031"
            "phase1/foundation-reliability-20261031"
            "phase2/security-graphify-20261031"
          )
          failures=0
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${encoded}"; then
              echo "Deleted superseded branch: ${branch}"
            else
              echo "::error::Could not delete branch: ${branch}"
              failures=$((failures + 1))
            fi
          done
          if (( failures > 0 )); then
            echo "::error::${failures} reviewed legacy branch refs could not be deleted."
            exit 1
          fi
          echo "Legacy branch cleanup complete. The main branch was intentionally preserved."
