name: PHP syntax check

on:
  pull_request:
  push:
    branches: [main, feat/registration-permissions-final-spec, feature/profiles-help-media, fix/audit-priority-issues]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find app bin config public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify CLI boot does not start a browser session
        run: php tests/php/cli-boot.php
      - name: Verify RateLimiter API references
        run: php tests/php/rate-limiter-api.php
      - name: Check JavaScript syntax
        run: |
          find public/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
