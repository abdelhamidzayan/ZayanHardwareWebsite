name: Database migration integration

on:
  pull_request:
  push:
    branches: [main, feature/profiles-help-media, fix/audit-priority-issues]

jobs:
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - image: mysql:8.0
            label: MySQL 8.0
          - image: mariadb:10.11
            label: MariaDB 10.11
          - image: mariadb:10.4.32
            label: MariaDB 10.4.32
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql

      - name: Wait for database
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Database did not become ready"
          exit 1

      - name: Verify sequential registration migrations and legacy data preservation
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE zayan_registration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < tests/database/pre_registration_schema.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/002_final_registration_permissions.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/002_registration_wizard.sql

          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT phone FROM users WHERE id = 1;")" = "+201000000001"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT board_experience FROM technician_profiles WHERE user_id = 1;")" = "5-10"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM user_skill_domains usd JOIN skill_domains sd ON sd.id = usd.skill_domain_id WHERE usd.user_id = 1 AND sd.slug = 'power';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM user_skill_ratings WHERE user_id = 1;")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT role FROM users WHERE id = 1;")" = "admin"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT phone FROM users WHERE id = 2;")" = "+201000000002"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT board_experience FROM technician_profiles WHERE user_id = 2;")" = "1-3"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT specialization_value FROM technician_profile_specialization_history WHERE user_id = 2;")" = "legacy_board_repair"

          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'technician_profiles' AND column_name IN ('phone','specialization','experience');")" -eq 0
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'technician_profiles' AND column_name IN ('device_focus','tech_level','board_experience','level_verified');")" -eq 4

          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/015_deleted_accounts_without_contact.sql
          due_index_count="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'account_deletion_requests' AND index_name = 'idx_account_deletion_due';")"
          echo "due_index_count=${due_index_count}"
          test "${due_index_count}" -eq 1

          check_clause="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT CHECK_CLAUSE FROM information_schema.CHECK_CONSTRAINTS WHERE CONSTRAINT_SCHEMA = DATABASE() AND CONSTRAINT_NAME = 'chk_users_contact';")"
          echo "contact_check_clause=${check_clause}"
          echo "${check_clause}" | grep -qi 'account_status'
          echo "${check_clause}" | grep -qi 'deleted'

          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "UPDATE users SET email = NULL, phone = NULL, account_status = 'deleted' WHERE id = 2;"
          deleted_count="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM users WHERE id = 2 AND email IS NULL AND phone IS NULL AND account_status = 'deleted';")"
          echo "contactless_deleted_account_count=${deleted_count}"
          test "${deleted_count}" -eq 1

          if mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SHOW VARIABLES LIKE 'check_constraint_checks';" | grep -qi 'check_constraint_checks'; then
            mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SET SESSION check_constraint_checks = ON; UPDATE users SET account_status = 'active' WHERE id = 2;" 2>/dev/null
          else
            mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "UPDATE users SET account_status = 'active' WHERE id = 2;" 2>/dev/null
          fi && {
            echo "ERROR: Contactless active account unexpectedly passed chk_users_contact"
            exit 1
          }
          echo "Contact constraint enforcement verified on ${{ matrix.database.label }}"
      - name: Create disposable test schema
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE zayan_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Prepare baseline tables
        run: mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < tests/database/pre_feature_schema.sql

      - name: Apply profile and composer migrations
        run: |
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/011_profiles_personal_help_and_publication.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/012_post_composer_drafts_and_device_catalog.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/013_terms_acceptance_audit.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/014_rate_limit_buckets.sql

      - name: Verify schema and foreign-key compatibility
        env:
          DB_NAME: zayan_migration_test
        run: |
          mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "
            INSERT INTO users () VALUES (), ();
            INSERT INTO issues (user_id, title, device_model, description)
              VALUES (1, 'Migration smoke test', 'Infinix X605', 'Test issue for schema compatibility');
            INSERT INTO device_models (manufacturer_id, commercial_name, model_code)
              SELECT id, 'Smart 5', 'X605' FROM device_manufacturers WHERE slug = 'infinix';
            INSERT INTO post_drafts (id, user_id, revision, payload_json)
              VALUES ('11111111-1111-4111-8111-111111111111', 1, 1, JSON_OBJECT('title', 'Draft smoke test'));
            INSERT INTO post_draft_media
              (draft_id, media_uuid, media_kind, storage_path, rendered_path, rendered_mime_type,
               mime_type, file_size, sha256, editor_state)
              VALUES
              ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222',
               'image', 'drafts/test/original.jpg', 'drafts/test/rendered.webp', 'image/webp',
               'image/jpeg', 1024, REPEAT('a', 64), JSON_OBJECT('version', 1));
            INSERT INTO issue_attachments
              (issue_id, uploaded_by, file_path, mime_type, file_size, original_file_path,
               original_mime_type, rendered_file_path, rendered_mime_type, editor_state, sort_order)
              VALUES
              (1, 1, 'issues/1/rendered.webp', 'image/webp', 512, 'issues/1/original.jpg',
               'image/jpeg', 'issues/1/rendered.webp', 'image/webp', JSON_OBJECT('version', 1), 0);
            INSERT INTO terms_acceptances (user_id, terms_version, ip_hash)
              VALUES (1, '2026-10-28', REPEAT('b', 64));
            INSERT INTO rate_limit_buckets (bucket, window_started_at, hit_count)
              VALUES ('ci-rate-limit-smoke', UTC_TIMESTAMP(), 1);
            UPDATE rate_limit_buckets SET hit_count = hit_count + 1
              WHERE bucket = 'ci-rate-limit-smoke';
          "

          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM device_manufacturers;")" -ge 15
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'issue_attachments' AND column_name IN ('original_file_path','original_mime_type','rendered_file_path','rendered_mime_type','editor_state','sort_order');")" -eq 6
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM post_draft_media WHERE rendered_mime_type = 'image/webp';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM issue_attachments WHERE original_mime_type = 'image/jpeg' AND rendered_mime_type = 'image/webp';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM terms_acceptances WHERE terms_version = '2026-10-28';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT hit_count FROM rate_limit_buckets WHERE bucket = 'ci-rate-limit-smoke';")" -eq 2
          mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM rate_limit_buckets WHERE bucket = 'ci-rate-limit-smoke';"
          echo "Migration smoke tests passed on ${{ matrix.database.label }}"

      - name: Exercise rate limiter against disposable database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_migration_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/rate-limiter-integration.php

      - name: Exercise account retention and technical-content preservation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_migration_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/account-retention-integration.php
