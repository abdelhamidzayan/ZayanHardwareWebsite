name: Database migration integration

on:
  pull_request:
  push:
    branches: [main, feature/profiles-help-media, fix/audit-priority-issues, audit/system-rebuild-20261031]

jobs:
  migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - image: mysql:8.0
            label: MySQL 8.0
          - image: mariadb:10.11
            label: MariaDB 10.11
          - image: mariadb:10.4.32
            label: MariaDB 10.4.32
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql

      - name: Wait for database
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Database did not become ready"
          exit 1

      - name: Verify complete fresh install from an empty schema
        run: |
          set -euo pipefail
          DB_NAME=zayan_fresh_install_test
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE ${DB_NAME} CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

          migrations=(
            database/migrations/000_core_identity_schema.sql
            database/migrations/001_issue_discussion.sql
            database/migrations/002_final_registration_permissions.sql
            database/migrations/002_registration_wizard.sql
            database/migrations/003_featured_home_issues.sql
            database/migrations/004_content_types.sql
            database/migrations/005_diagnostic_updates_and_repair_confirmation.sql
            database/migrations/006_notifications_and_push_subscriptions.sql
            database/migrations/007_threaded_replies_and_edit_history.sql
            database/migrations/008_inline_media_tokens.sql
            database/migrations/009_soft_delete_posts.sql
            database/migrations/010_diagnostic_update_history.sql
            database/migrations/011_profiles_personal_help_and_publication.sql
            database/migrations/012_post_composer_drafts_and_device_catalog.sql
            database/migrations/013_terms_acceptance_audit.sql
            database/migrations/014_rate_limit_buckets.sql
            database/migrations/015_deleted_accounts_without_contact.sql
            database/migrations/016_protect_technical_history.sql
            database/migrations/017_block_physical_content_delete.sql
            database/migrations/018_storage_recovery_tasks.sql
          )

          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            mysql --default-character-set=utf8mb4 -h 127.0.0.1 -uroot -proot "${DB_NAME}" < "${migration}"
          done

          expected_tables=(
            users technician_profiles technician_profile_specialization_history storage_recovery_tasks
            issues issue_attachments issue_replies reply_votes issue_edit_history issue_results reputation_events
            terms_acceptances user_device_specializations skill_domains user_skill_domains user_skill_ratings
            skill_tests skill_test_attempts admin_password_resets account_deletion_requests security_audit_logs
            featured_home_issues issue_diagnostic_updates notifications push_subscriptions
            issue_reply_edit_history issue_diagnostic_update_edit_history
            help_requests help_request_messages help_request_attachments help_request_publications help_public_posts
            device_manufacturers device_models device_model_suggestions post_drafts post_draft_media rate_limit_buckets
          )
          for table in "${expected_tables[@]}"; do
            exists="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '${DB_NAME}' AND table_name = '${table}';")"
            test "${exists}" -eq 1 || { echo "Missing fresh-install table: ${table}"; exit 1; }
          done

          legacy_columns="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = '${DB_NAME}' AND table_name = 'technician_profiles' AND column_name IN ('phone','specialization','experience');")"
          test "${legacy_columns}" -eq 0
          final_profile_columns="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = '${DB_NAME}' AND table_name = 'technician_profiles' AND column_name IN ('device_focus','tech_level','board_experience','level_verified','workshop_name','biography');")"
          test "${final_profile_columns}" -eq 6

          mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "
            INSERT INTO users (username, display_name, email, password_hash)
              VALUES ('fixture_owner', 'Fixture Owner', 'owner@fresh.test', 'not-a-real-hash');
            INSERT INTO technician_profiles (user_id, device_focus, tech_level, board_experience, level_verified, workshop_name, biography)
              VALUES (1, 'iphone', 'board', '5-10', 0, 'Test workshop', 'Disposable fresh-install fixture');
            INSERT INTO terms_acceptances (user_id, terms_version, ip_hash)
              VALUES (1, 'ci-fresh-install', REPEAT('a', 64));
            INSERT INTO issues (user_id, content_type, title, device_model, category, description, measurements, status)
              VALUES (1, 'technical_post', 'Fresh install smoke test', NULL, NULL, 'Disposable content fixture', NULL, 'open');
            INSERT INTO issues (user_id, content_type, title, device_model, category, description, measurements, status)
              VALUES (1, 'technical_post', 'Standalone delete guard fixture', NULL, NULL, 'Disposable row with no dependent content', NULL, 'open');
            INSERT INTO issue_replies (issue_id, user_id, body)
              VALUES (1, 1, 'Disposable reply fixture');
            INSERT INTO issue_replies (issue_id, user_id, body)
              VALUES (2, 1, 'Standalone delete guard reply');
            INSERT INTO issue_reply_edit_history (issue_reply_id, editor_id, previous_body)
              VALUES (1, 1, 'Earlier disposable reply');
            INSERT INTO issue_diagnostic_updates (issue_id, user_id, body)
              VALUES (1, 1, 'Disposable diagnosis fixture');
            INSERT INTO issue_diagnostic_update_edit_history (diagnostic_update_id, editor_id, previous_body)
              VALUES (1, 1, 'Earlier disposable diagnosis');
            INSERT INTO issue_attachments (issue_id, uploaded_by, file_path, mime_type, file_size, is_inline)
              VALUES (1, 1, 'issues/1/fixture.jpg', 'image/jpeg', 128, 0);
            INSERT INTO users (username, display_name, email, phone, password_hash)
              VALUES ('fixture_deleted', 'Fixture Deleted', NULL, '+201000000099', 'not-a-real-hash');
            UPDATE users SET email = NULL, phone = NULL, account_status = 'deleted' WHERE id = 2;
            INSERT INTO users (username, display_name, email, password_hash)
              VALUES ('fixture_second', 'Fixture Second', 'second@fresh.test', 'not-a-real-hash');
          "

          DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME="${DB_NAME}" DB_USER=root DB_PASS=root php bin/bootstrap-first-admin.php --username=fixture_owner --confirm-database="${DB_NAME}" --confirm-first-admin
          first_admin_role="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT role FROM users WHERE id = 1;")"
          test "${first_admin_role}" = "admin"

          if DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME="${DB_NAME}" DB_USER=root DB_PASS=root php bin/bootstrap-first-admin.php --username=fixture_second --confirm-database="${DB_NAME}" --confirm-first-admin; then
            echo "ERROR: first-admin bootstrap allowed a second administrator bootstrap"
            exit 1
          fi

          deleted_contactless="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM users WHERE id = 2 AND email IS NULL AND phone IS NULL AND account_status = 'deleted';")"
          test "${deleted_contactless}" -eq 1
          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "UPDATE users SET account_status = 'active' WHERE id = 2;" 2>/dev/null; then
            echo "ERROR: contactless active account unexpectedly passed chk_users_contact"
            exit 1
          fi

          fk_count="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.key_column_usage WHERE table_schema = '${DB_NAME}' AND referenced_table_name IS NOT NULL;")"
          test "${fk_count}" -ge 50

          retention_constraints=(
            fk_016_issue_replies_issue
            fk_016_issue_replies_parent
            fk_016_issue_attachments_issue
            fk_016_issue_history_issue
            fk_016_issue_results_issue
            fk_016_issue_diagnostic_updates_issue
            fk_016_help_requests_requester
            fk_016_help_messages_request
            fk_016_help_public_posts_request
            fk_016_post_drafts_user
          )
          for constraint in "${retention_constraints[@]}"; do
            delete_rule="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT DELETE_RULE FROM information_schema.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA = '${DB_NAME}' AND CONSTRAINT_NAME = '${constraint}';")"
            test "${delete_rule}" = "RESTRICT" || { echo "Expected RESTRICT for ${constraint}, got ${delete_rule}"; exit 1; }
          done

          expected_triggers=(
            trg_users_block_physical_delete trg_technician_profiles_block_physical_delete
            trg_issues_block_physical_delete trg_issue_attachments_block_physical_delete
            trg_issue_replies_block_physical_delete trg_issue_edit_history_block_physical_delete
            trg_issue_reply_edit_history_block_physical_delete trg_issue_results_block_physical_delete
            trg_issue_diagnostic_updates_block_physical_delete trg_diagnostic_update_history_block_physical_delete
            trg_reputation_events_block_physical_delete trg_terms_acceptances_block_physical_delete
            trg_account_deletion_requests_block_physical_delete trg_security_audit_logs_block_physical_delete
            trg_admin_password_resets_block_physical_delete trg_skill_test_attempts_block_physical_delete
            trg_help_requests_block_physical_delete trg_help_request_messages_block_physical_delete
            trg_help_request_attachments_block_physical_delete trg_help_request_publications_block_physical_delete
            trg_help_public_posts_block_physical_delete trg_device_model_suggestions_block_physical_delete
            trg_profile_specialization_history_no_delete
            trg_user_skill_ratings_block_delete
            trg_skill_tests_block_physical_delete
            trg_skill_domains_block_physical_delete
            trg_device_manufacturers_block_delete
            trg_device_models_block_physical_delete
            trg_storage_recovery_tasks_no_delete
          )
          for trigger in "${expected_triggers[@]}"; do
            trigger_exists="$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = '${DB_NAME}' AND TRIGGER_NAME = '${trigger}';")"
            test "${trigger_exists}" -eq 1 || { echo "Missing physical-delete guard: ${trigger}"; exit 1; }
          done

          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM issues WHERE id = 2;" 2>/dev/null; then
            echo "ERROR: standalone physical issue deletion unexpectedly succeeded"
            exit 1
          fi
          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM issue_replies WHERE id = 2;" 2>/dev/null; then
            echo "ERROR: standalone physical reply deletion unexpectedly succeeded"
            exit 1
          fi
          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM issue_attachments WHERE id = 1;" 2>/dev/null; then
            echo "ERROR: physical technical attachment deletion unexpectedly succeeded"
            exit 1
          fi
          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM issues WHERE id = 1;" 2>/dev/null; then
            echo "ERROR: physical issue deletion unexpectedly succeeded"
            exit 1
          fi
          if mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM users WHERE id = 1;" 2>/dev/null; then
            echo "ERROR: physical account deletion unexpectedly succeeded"
            exit 1
          fi
          echo "Full fresh-install schema and content smoke test passed on ${{ matrix.database.label }} (FKs: ${fk_count})"

      - name: Verify last active administrator protection
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_fresh_install_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/admin-roster-integration.php

      - name: Exercise atomic issue and reply media writes
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_fresh_install_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/content-write-integration.php

      - name: Verify model-level issue review and vote authorization
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_fresh_install_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/issue-authorization-integration.php

      - name: Exercise reply tombstone and thread preservation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_fresh_install_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/reply-tombstone-integration.php

      - name: Verify sequential registration migrations and legacy data preservation
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE zayan_registration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < tests/database/pre_registration_schema.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/002_final_registration_permissions.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/002_registration_wizard.sql

          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT phone FROM users WHERE id = 1;")" = "+201000000001"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT board_experience FROM technician_profiles WHERE user_id = 1;")" = "5-10"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM user_skill_domains usd JOIN skill_domains sd ON sd.id = usd.skill_domain_id WHERE usd.user_id = 1 AND sd.slug = 'power';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM user_skill_ratings WHERE user_id = 1;")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT role FROM users WHERE id = 1;")" = "admin"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT phone FROM users WHERE id = 2;")" = "+201000000002"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT board_experience FROM technician_profiles WHERE user_id = 2;")" = "1-3"
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT specialization_value FROM technician_profile_specialization_history WHERE user_id = 2;")" = "legacy_board_repair"

          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'technician_profiles' AND column_name IN ('phone','specialization','experience');")" -eq 0
          test "$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'technician_profiles' AND column_name IN ('device_focus','tech_level','board_experience','level_verified');")" -eq 4

          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test < database/migrations/015_deleted_accounts_without_contact.sql
          due_index_count="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema = DATABASE() AND table_name = 'account_deletion_requests' AND index_name = 'idx_account_deletion_due';")"
          echo "due_index_count=${due_index_count}"
          test "${due_index_count}" -eq 1

          check_clause="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT CHECK_CLAUSE FROM information_schema.CHECK_CONSTRAINTS WHERE CONSTRAINT_SCHEMA = DATABASE() AND CONSTRAINT_NAME = 'chk_users_contact';")"
          echo "contact_check_clause=${check_clause}"
          echo "${check_clause}" | grep -qi 'account_status'
          echo "${check_clause}" | grep -qi 'deleted'

          mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "UPDATE users SET email = NULL, phone = NULL, account_status = 'deleted' WHERE id = 2;"
          deleted_count="$(mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SELECT COUNT(*) FROM users WHERE id = 2 AND email IS NULL AND phone IS NULL AND account_status = 'deleted';")"
          echo "contactless_deleted_account_count=${deleted_count}"
          test "${deleted_count}" -eq 1

          if mysql -N -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SHOW VARIABLES LIKE 'check_constraint_checks';" | grep -qi 'check_constraint_checks'; then
            mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "SET SESSION check_constraint_checks = ON; UPDATE users SET account_status = 'active' WHERE id = 2;" 2>/dev/null
          else
            mysql -h 127.0.0.1 -uroot -proot zayan_registration_test -e "UPDATE users SET account_status = 'active' WHERE id = 2;" 2>/dev/null
          fi && {
            echo "ERROR: Contactless active account unexpectedly passed chk_users_contact"
            exit 1
          }
          echo "Contact constraint enforcement verified on ${{ matrix.database.label }}"
      - name: Create disposable test schema
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE zayan_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Prepare baseline tables
        run: mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < tests/database/pre_feature_schema.sql

      - name: Apply profile and composer migrations
        run: |
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/011_profiles_personal_help_and_publication.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/012_post_composer_drafts_and_device_catalog.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/013_terms_acceptance_audit.sql
          mysql -h 127.0.0.1 -uroot -proot zayan_migration_test < database/migrations/014_rate_limit_buckets.sql

      - name: Verify schema and foreign-key compatibility
        env:
          DB_NAME: zayan_migration_test
        run: |
          mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "
            INSERT INTO users () VALUES (), ();
            INSERT INTO issues (user_id, title, device_model, description)
              VALUES (1, 'Migration smoke test', 'Infinix X605', 'Test issue for schema compatibility');
            INSERT INTO device_models (manufacturer_id, commercial_name, model_code)
              SELECT id, 'Smart 5', 'X605' FROM device_manufacturers WHERE slug = 'infinix';
            INSERT INTO post_drafts (id, user_id, revision, payload_json)
              VALUES ('11111111-1111-4111-8111-111111111111', 1, 1, JSON_OBJECT('title', 'Draft smoke test'));
            INSERT INTO post_draft_media
              (draft_id, media_uuid, media_kind, storage_path, rendered_path, rendered_mime_type,
               mime_type, file_size, sha256, editor_state)
              VALUES
              ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222',
               'image', 'drafts/test/original.jpg', 'drafts/test/rendered.webp', 'image/webp',
               'image/jpeg', 1024, REPEAT('a', 64), JSON_OBJECT('version', 1));
            INSERT INTO issue_attachments
              (issue_id, uploaded_by, file_path, mime_type, file_size, original_file_path,
               original_mime_type, rendered_file_path, rendered_mime_type, editor_state, sort_order)
              VALUES
              (1, 1, 'issues/1/rendered.webp', 'image/webp', 512, 'issues/1/original.jpg',
               'image/jpeg', 'issues/1/rendered.webp', 'image/webp', JSON_OBJECT('version', 1), 0);
            INSERT INTO terms_acceptances (user_id, terms_version, ip_hash)
              VALUES (1, '2026-10-28', REPEAT('b', 64));
            INSERT INTO rate_limit_buckets (bucket, window_started_at, hit_count)
              VALUES ('ci-rate-limit-smoke', UTC_TIMESTAMP(), 1);
            UPDATE rate_limit_buckets SET hit_count = hit_count + 1
              WHERE bucket = 'ci-rate-limit-smoke';
          "

          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM device_manufacturers;")" -ge 15
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = DATABASE() AND table_name = 'issue_attachments' AND column_name IN ('original_file_path','original_mime_type','rendered_file_path','rendered_mime_type','editor_state','sort_order');")" -eq 6
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM post_draft_media WHERE rendered_mime_type = 'image/webp';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM issue_attachments WHERE original_mime_type = 'image/jpeg' AND rendered_mime_type = 'image/webp';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT COUNT(*) FROM terms_acceptances WHERE terms_version = '2026-10-28';")" -eq 1
          test "$(mysql -N -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "SELECT hit_count FROM rate_limit_buckets WHERE bucket = 'ci-rate-limit-smoke';")" -eq 2
          mysql -h 127.0.0.1 -uroot -proot "${DB_NAME}" -e "DELETE FROM rate_limit_buckets WHERE bucket = 'ci-rate-limit-smoke';"
          echo "Migration smoke tests passed on ${{ matrix.database.label }}"

      - name: Exercise rate limiter against disposable database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_migration_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/rate-limiter-integration.php

      - name: Exercise account retention and technical-content preservation
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: zayan_migration_test
          DB_USER: root
          DB_PASS: root
        run: php tests/php/account-retention-integration.php
